<div class="overview-capture-row" data-capture-ignore>
  <a class="capture-btn" href="about:blank" target="_blank" data-capture-target="pageContent" aria-label="Capture Overview screen as an image">CAPTURE SCREEN</a>
</div>

<!-- Live state. Deliberately outside the range filter: these describe what is
     happening now, not what happened during a selected period. -->
<div class="ov-top ov-live">
  <div class="metric-card">
    <div class="mc-label">NOW</div>
    <div class="mc-value" id="ovNowState" style="font-size:14px;padding-top:7px">—</div>
    <div class="mc-sub" id="ovNowModel">no model loaded</div>
    <div class="mc-sub" id="ovNowSub"></div>
  </div>
  <div class="metric-card">
    <div class="mc-label">INFERENCE TIME</div>
    <div class="mc-value" id="ovInfVal">—</div>
    <div class="mc-sub" id="ovInfSub">—</div>
  </div>
</div>

<div class="page-controls">
  <div style="display:flex;align-items:center;gap:10px">
    <span class="muted" style="font-size:9.5px;letter-spacing:0.1em;font-weight:600">PERIOD</span>
    <span class="muted" id="ovRangeNote" style="font-size:11px"></span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="seg" id="ovRngSeg"></div>
  </div>
</div>

<div class="metric-strip" id="ovCards"></div>

<div class="ov-charts">
  <div class="panel">
    <div class="panel-head"><b>Tokens by model — last 24h</b><span class="muted">hourly buckets</span></div>
    <div class="chart-box tall" id="ovUsage"></div>
  </div>
</div>

<div class="ov-charts">
  <div class="panel">
    <div class="panel-head"><b>Daily volume — last 30 days</b><span class="muted">inference time · prompt · generated · unsplit total</span></div>
    <div class="chart-box tall" id="ovDaily"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><b>Recent sessions</b><span class="muted">last 10 observed</span></div>
  <table class="data-table" id="ovRecent">
    <thead>
      <tr><th>Started</th><th>Model</th><th class="num">Duration</th><th class="num">Gen tok</th><th class="num">Gen t/s</th><th class="num">MTP</th></tr>
    </thead>
    <tbody id="ovRecentBody"></tbody>
  </table>
</div>
