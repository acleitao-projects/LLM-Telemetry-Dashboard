<div class="page-controls">
  <div style="display:flex;align-items:center;gap:10px">
    <span class="muted" style="font-size:9.5px;letter-spacing:0.1em;font-weight:600">SORT BY</span>
    <div class="seg" id="sortSeg"></div>
    <span class="muted" id="mModelsCount" style="font-size:11px"></span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="seg" id="grpSeg"></div>
    <div class="seg" id="rngSeg"></div>
    <a class="capture-btn" href="about:blank" target="_blank" data-capture-target="pageContent" data-capture-width="1800" data-capture-ignore aria-label="Capture Models screen as an image">CAPTURE SCREEN</a>
  </div>
</div>

<div class="metric-strip" id="topCards"></div>

<div class="models-grid">
  <div class="panel models-list-panel" id="modelsListPanel">
    <div class="capture-row" data-capture-ignore>
      <span>MODELS LIST</span>
      <a class="capture-btn" href="about:blank" target="_blank" data-capture-target="modelsListPanel" aria-label="Capture models list as an image">CAPTURE</a>
    </div>
    <div class="table-scroll">
      <table class="data-table models-table" id="modelTable">
        <thead>
          <tr>
            <th class="m-rank">#</th>
            <th class="col-model">Model</th>
            <th class="col-activity">Activity</th>
            <th class="num col-tok">In tok</th>
            <th class="num col-tok">Out tok</th>
            <th class="num col-tok">Total</th>
            <th class="num col-cost">In cost</th>
            <th class="num col-cost">Out cost</th>
            <th class="num col-cost">Cost</th>
            <th class="num">Sess</th>
            <th class="num">t/s</th>
            <th class="col-spark">Trend</th>
          </tr>
        </thead>
        <tbody id="modelTableBody"></tbody>
      </table>
    </div>
  </div>
  <div class="panel" id="selPanel">
    <div class="empty">select a model</div>
  </div>
</div>
