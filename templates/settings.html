<div class="set-section">
  <h3>System <span>passive collection status, refreshed on load</span></h3>
  <div class="panel" style="padding:8px 12px">
    <table class="data-table">
      <thead>
        <tr><th>Provider</th><th>URL</th><th class="num">Latency</th><th>Last success</th><th>Agent</th><th>Telemetry (last 5 min)</th><th>Build</th></tr>
      </thead>
      <tbody id="sysBody"></tbody>
    </table>
    <div class="muted" style="font-size:10.5px;margin-top:8px" id="sysMeta"></div>
    <div class="muted" style="font-size:10.5px;margin-top:2px;color:#d99a96" id="sysErr"></div>
  </div>
</div>

<div class="set-section">
  <h3>Providers <span>read-only llama.cpp endpoints — no prompts, ever</span></h3>
  <div id="provList"></div>
  <button class="btn primary" id="btnAddProv">+ Add provider</button>
  <div class="panel" id="addProvForm" style="margin-top:10px" hidden>
    <div class="form-grid">
      <div class="field"><label>Name</label><input type="text" id="np_name" placeholder="Nautilus"></div>
      <div class="field"><label>Type</label><input type="text" id="np_type" value="llama.cpp"></div>
      <div class="field"><label>Base URL (llama.cpp)</label><input type="text" id="np_url" placeholder="http://host:8080"></div>
      <div class="field"><label>Agent URL (optional)</label><input type="text" id="np_agent" placeholder="http://host:8091"></div>
      <div class="field"><label>Poll interval (s)</label><input type="number" id="np_poll" value="1" step="0.25" min="0.25"></div>
      <div class="field" style="justify-content:flex-end"><label style="visibility:hidden">.</label>
        <label style="font-size:11.5px;display:flex;gap:6px;align-items:center;visibility:visible"><input type="checkbox" id="np_def"> set as default</label>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn primary small" id="btnDoAddProv">Create</button>
      <button class="btn small" id="btnCancelAddProv" onclick="document.getElementById('addProvForm').hidden=true">Cancel</button>
    </div>
  </div>
</div>

<div class="set-section">
  <h3>Display <span>defaults applied on the Models page</span></h3>
  <div class="panel form-grid">
    <div class="field"><label>Default range</label>
      <select id="d_range">
        <option value="today">today</option><option value="2d">2d</option><option value="3d">3d</option>
        <option value="5d">5d</option><option value="7d">7d</option><option value="30d">30d</option>
        <option value="all">all</option>
      </select>
    </div>
    <div class="field"><label>Default group</label>
      <select id="d_group">
        <option value="family">family</option><option value="file">each file</option><option value="quant">quant</option>
      </select>
    </div>
    <div class="field"><label>Theme</label>
      <select id="d_theme"><option value="dark">dark</option></select>
    </div>
    <div class="field" style="justify-content:flex-end"><label style="visibility:hidden">.</label>
      <button class="btn primary" id="btnSaveDisp">Save display settings</button>
    </div>
  </div>
</div>
